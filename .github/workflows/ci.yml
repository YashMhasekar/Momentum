name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/server/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ai-service/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend server dependencies
        working-directory: backend/server
        run: npm ci

      - name: Check backend server syntax
        working-directory: backend/server
        run: node --check server.js

      - name: Install AI service dependencies
        working-directory: backend/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check AI service syntax
        working-directory: backend/ai-service
        run: python -m py_compile chatbot_api.py chatbot_api_alternative.py emotion_detection.py
